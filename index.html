<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credits Pending</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: Helvetica, Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #stage {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 0;
    }
    #strip {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: min(700px, 90vw);
    }
    .credits-copy {
      display: flex;
      flex-direction: column;
      gap: 0.88rem;
      padding: 6vh 0;
    }
    .credit-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 2rem;
    }
    .credit-label {
      font-size: clamp(0.9rem, 2.2vw, 1.25rem);
      letter-spacing: 0.04em;
      color: #fff;
      flex: 1;
      text-align: left;
    }
    .credit-name {
      font-size: clamp(0.9rem, 2.2vw, 1.25rem);
      letter-spacing: 0.04em;
      color: #fff;
      flex: 1;
      text-align: right;
    }
    .credit-name.highlight {
      text-shadow: 0 0 20px rgba(255,255,255,0.8);
    }
    .credit-divider {
      text-align: center;
      font-size: clamp(0.6rem, 1.4vw, 0.8rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #555;
      margin-top: 1.76rem;
      margin-bottom: 1.76rem;
    }
    #input-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      padding: 0.8rem 1rem calc(1.4rem + env(safe-area-inset-bottom));
      background: linear-gradient(to top, #000 70%, transparent);
    }
    #input-bar form {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 560px;
      gap: 0.4rem;
    }
    .form-row {
      display: flex;
      width: 100%;
      gap: 0.4rem;
      flex-wrap: nowrap;
    }
    input {
      flex: 1;
      min-width: 0;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      color: #fff;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.03em;
      padding: 0.55rem 0.7rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input::placeholder { color: rgba(255,255,255,0.3); }
    input:focus { border-color: rgba(255,255,255,0.5); }
    #add-btn {
      flex-shrink: 0;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 4px;
      color: #fff;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      padding: 0.55rem 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    #add-btn:hover { background: rgba(255,255,255,0.18); }
    #toast {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      height: 1rem;
    }
    #toast.visible { opacity: 1; }
    #tee-cta {
      display: none;
      width: 100%;
      max-width: 560px;
      text-align: center;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 4px;
      padding: 0.55rem 1rem;
      margin-bottom: 1.2rem;
      transition: background 0.2s;
    }
    #tee-cta.show { display: block; }
    #tee-cta:hover { background: rgba(255,255,255,0.18); }
  </style>
</head>
<body>

  <div id="stage">
    <div id="strip"></div>
  </div>

  <div id="input-bar">
    <div id="toast">Your credit is rolling.</div>
    <form id="credit-form">
      <div class="form-row">
        <input id="name-input" type="text" placeholder="Your name" maxlength="40" autocomplete="off" />
        <input id="role-input" type="text" placeholder="Your role" maxlength="60" autocomplete="off" />
      </div>
      <div class="form-row">
        <input id="email-input" type="email" placeholder="Email for 10% off your shirt (optional)" maxlength="80" autocomplete="off" />
        <button id="add-btn" type="submit">Add</button>
      </div>
    </form>
    <a id="tee-cta" href="https://www.csuper.co/products/csuper-credits-pending-drop-shoulder-tee-black" target="_blank">Get my credits shirt</a>
  </div>

  <script>
    const SUPABASE_URL = 'https://lnpqumqesmygyjdudioh.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxucHF1bXFlc215Z3lqZHVkaW9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNDY2OTcsImV4cCI6MjA5MzcyMjY5N30.Jc605lOaj3CdEGNkOag-a_5LmpDeQFc6TVqfc59aUlk';

    // ---- KLAVIYO: fill these two in ----
    // KLAVIYO_PUBLIC_KEY = your 6-character site ID (Settings > API keys). Safe to expose client-side.
    // KLAVIYO_LIST_ID    = the List ID your 10%-off flow listens to. Set that list to SINGLE opt-in.
    const KLAVIYO_PUBLIC_KEY = 'Uwt9Wb';
    const KLAVIYO_LIST_ID = 'V9E8Pj';
    const KLAVIYO_REVISION = '2025-01-15';

    // ---- CAMPAIGN (buyer mode) ----
    // Visitors arriving with ?ref=credits-email get the shirt CTA swapped for the
    // workwear collection, with the discount auto-applied at checkout.
    const DISCOUNT_CODE = 'ITSALLME';
    const WORKWEAR_COLLECTION = '/collections/csuper-creative-workwear';

    const baseCredits = [
      { divider: "A Film By" },
      { label: "Directed By", name: "Me" },
      { label: "Produced By", name: "Me" },
      { label: "Written By", name: "Me" },
      { divider: "Cast" },
      { label: "Lead Role", name: "Me" },
      { label: "Supporting Role", name: "Me" },
      { label: "Comic Relief", name: "Me" },
      { label: "The Villain", name: "Me" },
      { label: "The Hero", name: "Me" },
      { divider: "Crew" },
      { label: "Director Of Photography", name: "Me" },
      { label: "Film Editor", name: "Me" },
      { label: "Production Designer", name: "Me" },
      { label: "Costume Designer", name: "Me" },
      { label: "Sound Designer", name: "Me" },
      { label: "Visual Effects", name: "Me" },
      { label: "Special Effects", name: "Me" },
      { label: "Stunt Coordinator", name: "Me" },
      { label: "Casting By", name: "Me" },
      { divider: "Music" },
      { label: "Original Score", name: "Me" },
      { label: "Music Supervisor", name: "Me" },
      { label: "Theme Song By", name: "Me" },
      { divider: "Post Production" },
      { label: "Colorist", name: "Me" },
      { label: "Title Design", name: "Me" },
      { label: "Subtitles", name: "Me" },
      { divider: "Business" },
      { label: "Executive Producer", name: "Me" },
      { label: "Co-Executive Producer", name: "Me" },
      { label: "Line Producer", name: "Me" },
      { label: "Production Accountant", name: "Me" },
      { label: "Legal Counsel", name: "Me" },
      { divider: "Special Thanks" },
      { label: "Moral Support", name: "Me" },
      { label: "Coffee Provider", name: "Me" },
      { label: "Chief Motivator", name: "Me" },
      { label: "Best Boy", name: "Me" },
    ];

    let credits = [...baseCredits];
    let userEntryIndex = -1;
    let speedMultiplier = 1;
    let jumpInProgress = false;

    async function loadFromDB() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/credits?select=name,role&order=id`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });
        const rows = await res.json();
        credits = [...baseCredits];
        if (Array.isArray(rows) && rows.length) {
          credits.push({ divider: "Also Starring" });
          rows.forEach(r => credits.push({ label: r.role, name: r.name }));
        }
      } catch(e) {
        credits = [...baseCredits];
      }
      render();
    }

    async function saveToDB(name, role) {
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/credits`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({ name, role })
        });
      } catch(e) {}
    }

    // Email goes to Klaviyo only, never to Supabase (the credits table is publicly readable).
    async function subscribeKlaviyo(email) {
      if (KLAVIYO_PUBLIC_KEY === 'XXXXXX' || KLAVIYO_LIST_ID === 'XXXXXX') return;
      try {
        await fetch(`https://a.klaviyo.com/client/subscriptions/?company_id=${KLAVIYO_PUBLIC_KEY}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'revision': KLAVIYO_REVISION
          },
          body: JSON.stringify({
            data: {
              type: 'subscription',
              attributes: {
                custom_source: 'Credits Pending miniverse',
                profile: {
                  data: {
                    type: 'profile',
                    attributes: {
                      email: email,
                      subscriptions: { email: { marketing: { consent: 'SUBSCRIBED' } } }
                    }
                  }
                }
              },
              relationships: { list: { data: { type: 'list', id: KLAVIYO_LIST_ID } } }
            }
          })
        });
      } catch(e) {}
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    const LOWERCASE_WORDS = new Set(['by']);
    function toTitleCase(str) {
      return str.toLowerCase().replace(/\b\w+/g, (word, offset) => {
        if (offset !== 0 && LOWERCASE_WORDS.has(word)) return word;
        return word.charAt(0).toUpperCase() + word.slice(1);
      });
    }

    function buildRow(entry, index) {
      if (entry.divider) return '<div class="credit-divider">' + entry.divider + '</div>';
      const highlight = (index === userEntryIndex) ? ' highlight' : '';
      return '<div class="credit-row" data-index="' + index + '"><span class="credit-label">' + toTitleCase(entry.label) + '</span><span class="credit-name' + highlight + '">' + entry.name + '</span></div>';
    }

    function buildCopy() {
      return '<div class="credits-copy">' + credits.map((c, i) => buildRow(c, i)).join('') + '</div>';
    }

    const strip = document.getElementById('strip');
    const SPEED = 100;
    let animationId = null;
    let lastTimestamp = null;
    let copyHeight = 0;
    let offset = 0;

    function render() {
      strip.innerHTML = buildCopy() + buildCopy();
      if (animationId) cancelAnimationFrame(animationId);
      requestAnimationFrame(() => {
        copyHeight = strip.querySelector('.credits-copy').offsetHeight;
        offset = window.innerHeight;
        lastTimestamp = null;
        animationId = requestAnimationFrame(step);
      });
    }

    function step(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;
      offset -= SPEED * speedMultiplier * delta;
      if (offset <= -copyHeight) offset += copyHeight;
      strip.style.transform = 'translateY(' + offset + 'px)';
      animationId = requestAnimationFrame(step);
    }

    function jumpToEntry(index) {
      if (jumpInProgress) return;
      jumpInProgress = true;
      const rows = strip.querySelectorAll('.credit-row');
      let targetRow = null;
      rows.forEach(row => {
        if (parseInt(row.dataset.index) === index && !targetRow) targetRow = row;
      });
      if (!targetRow) { jumpInProgress = false; return; }
      speedMultiplier = 8;
      const checkInterval = setInterval(() => {
        const rowTop = targetRow.getBoundingClientRect().top;
        const viewMiddle = window.innerHeight / 2;
        if (rowTop <= viewMiddle + 40 && rowTop >= viewMiddle - 40) {
          clearInterval(checkInterval);
          speedMultiplier = 0.3;
          setTimeout(() => {
            speedMultiplier = 1;
            jumpInProgress = false;
          }, 2000);
        }
      }, 50);
    }

    const form = document.getElementById('credit-form');
    const nameInput = document.getElementById('name-input');
    const roleInput = document.getElementById('role-input');
    const emailInput = document.getElementById('email-input');
    const toast = document.getElementById('toast');
    const teeCta = document.getElementById('tee-cta');
    let toastTimer = null;

    // Buyer mode: visitors arriving from the email campaign (?ref=credits-email)
    // already have an account and the ITSALLME code, so we hide the on-site email
    // capture to avoid presenting a second, competing discount rail.
    const BUYER_MODE = new URLSearchParams(window.location.search).get('ref') === 'credits-email';
    const addBtn = document.getElementById('add-btn');
    if (BUYER_MODE) {
      emailInput.style.display = 'none';
      addBtn.style.flex = '1';
      teeCta.href = 'https://www.csuper.co/discount/' + DISCOUNT_CODE + '?redirect=' + WORKWEAR_COLLECTION;
      teeCta.textContent = 'Shop the range';
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add('visible');
      toastTimer = setTimeout(() => toast.classList.remove('visible'), 4000);
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const name = nameInput.value.trim();
      const role = roleInput.value.trim();
      const email = BUYER_MODE ? '' : emailInput.value.trim();
      if (!name || !role) return;

      await saveToDB(name, toTitleCase(role));

      const gotEmail = email && isValidEmail(email);
      if (gotEmail) subscribeKlaviyo(email);

      if (!credits.find(c => c.divider === "Also Starring")) {
        credits.push({ divider: "Also Starring" });
      }
      credits.push({ label: toTitleCase(role), name });
      userEntryIndex = credits.length - 1;
      nameInput.value = '';
      roleInput.value = '';
      emailInput.value = '';
      showToast(gotEmail ? 'Your credit is rolling. Check your inbox for 10% off.' : 'Your credit is rolling.');
      form.style.display = 'none';
      teeCta.classList.add('show');
      const currentOffset = offset;
      strip.innerHTML = buildCopy() + buildCopy();
      requestAnimationFrame(() => {
        copyHeight = strip.querySelector('.credits-copy').offsetHeight;
        offset = currentOffset;
        strip.style.transform = 'translateY(' + offset + 'px)';
        setTimeout(() => jumpToEntry(userEntryIndex), 300);
      });
    });

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(render, 200);
    });

    loadFromDB();
  </script>
</body>
</html>
